server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_LAST
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
            methods: GET, POST, PUT, DELETE
            backoff:
              firstBackoff: 1000ms
              maxBackoff: 5000ms
              factor: 2
              basedOnPreviousValue: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${AUTH_RATE_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${AUTH_RATE_BURST:40}
                key-resolver: "#{@ipKeyResolver}"
            
        - id: product-service
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/reviews/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${PRODUCT_RATE_REPLENISH:150}
                redis-rate-limiter.burstCapacity: ${PRODUCT_RATE_BURST:300}
                key-resolver: "#{@ipKeyResolver}"
            
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${ORDER_RATE_REPLENISH:50}
                redis-rate-limiter.burstCapacity: ${ORDER_RATE_BURST:100}
                key-resolver: "#{@ipKeyResolver}"
            
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${PAYMENT_RATE_REPLENISH:50}
                redis-rate-limiter.burstCapacity: ${PAYMENT_RATE_BURST:100}
                key-resolver: "#{@ipKeyResolver}"
 
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${AI_RATE_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${AI_RATE_BURST:20}
                key-resolver: "#{@ipKeyResolver}"
 
        - id: chat-service
          uri: ${CHAT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/chats/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${CHAT_RATE_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${CHAT_RATE_BURST:60}
                key-resolver: "#{@ipKeyResolver}"
